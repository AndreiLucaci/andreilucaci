<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            Andrei Lucaci: Software Architect &amp; Founder · AEL Engineering
        </title>
        <meta
            name="description"
            content="Software architecture, hands-on engineering and technical leadership. Andrei Lucaci, founder of AEL Engineering. Explore PureKey, open source and selected experience."
        />
        <meta name="theme-color" content="#f4f3ed" />
        <script>
            ;(() => {
                const saved = localStorage.getItem('theme')
                const theme =
                    saved === 'light' || saved === 'dark'
                        ? saved
                        : matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light'
                document.documentElement.dataset.theme = theme
            })()
        </script>
        <link rel="canonical" href="https://andreilucaci.ro/" />
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="Andrei Lucaci: Engineering with intent."
        />
        <meta
            property="og:description"
            content="Software architecture, open source and AEL Engineering. Systems built with clarity, purpose and care."
        />
        <meta property="og:url" content="https://andreilucaci.ro/" />
        <meta
            property="og:image"
            content="https://andreilucaci.ro/assets/img/andrei-portrait.png"
        />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" href="/assets/img/favicon.ico" />
    </head>
